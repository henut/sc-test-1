<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <!-- 关键修复:请求 B 站头像外链时不发送 Referer,避免被 B 站 CDN 防盗链(403)拒绝 -->
  <meta name="referrer" content="no-referrer">
  <meta charset="UTF-8">
  <title>B站SC上墙活动 — 上B站,看LPL</title>
  <meta name="viewport" content="width=1280">
  <style>
    /* ===========================================================
       本地字体嵌入(按 PSD 实测字体)
         · 昵称    → LPL HEI Heavy
         · SC 内容 → LPL HEI Extra
       =========================================================== */
    @font-face {
      font-family: "LPL HEI Heavy";
      src: url("./front/LPL HEI Heavy.ttf") format("truetype");
      font-display: swap;
    }
    @font-face {
      font-family: "LPL HEI Extra";
      src: url("./front/LPL HEI Extra.ttf") format("truetype");
      font-display: swap;
    }

    /* —— 基础重置 —— */
    *,*::before,*::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-width: 1280px;
      background: #000;
      font-family: -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: auto;
      color: #fff;
    }

    /* —— 根容器,固定 1920×1080 设计稿 —— */
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      margin: 0 auto;
      background: #000 url("./assets/bg.png") center/100% 100% no-repeat;
      overflow: hidden;
    }

    /* ===========================================================
       评论组  —— 位置/尺寸全部取自 PSD 实测绝对坐标
         PSD「评论」组 bounds : L=235  T=352  R=1046  B=756

         头像    : L=561  T=352  R=722  B=512   → 161 × 160  圆形
         昵称    : L=564  T=549  R=715  B=580   → 151 ×  31  居中单行
         SC 内容 : L=235  T=637  R=1046 B=756   → 811 × 119  居中 3 行

         .fanwall 直接落在 PSD 组坐标 (235, 352),内部子元素
         使用「相对组坐标」(绝对坐标 − 235/352),与设计稿逐像素对齐。
       =========================================================== */
    .fanwall {
      position: absolute;
      left: 235px;
      top: 352px;
      width: 811px;
      height: 404px;
      overflow: visible;
    }

    /* 单条卡片(淡入淡出切换) */
    .fan-card {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
    }
    .fan-card.active { opacity: 1; pointer-events: auto; }

    /* —— 模块 1:头像 —— PSD 161×160,相对组坐标 (326, 0) —— */
    .fan-avatar {
      position: absolute;
      left: 326px;
      top: 0px;
      width: 161px;
      height: 160px;
      border-radius: 50%;
      overflow: hidden;
      background: #0d2a63;
      box-shadow: 0 8px 22px rgba(0,0,0,.45);
    }
    .fan-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* 无头像兜底 */
    .fan-avatar.noimg {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 58px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #4f7cff, #8f4bff);
    }

    /* —— 模块 2:昵称 —— 居中单行,超长不省略 —— */
    .fan-name {
      position: absolute;
      left: 0px;
      top: 191px;                 /* PSD T=549 − 352 = 197,视觉微调至 191 与头像间距一致 */
      width: 811px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "LPL HEI Heavy", "Microsoft YaHei", sans-serif;
      font-size: 32px;            /* 对应 PSD 实测昵称字高 31~32px(24pt) */
      font-weight: 800;
      letter-spacing: 0;
      color: #fff;
      text-align: center;
      line-height: 44px;          /* 32 × 1.33 ≈ 42.6,取整 44 与 PSD 行距 31.96pt 视觉一致 */
      white-space: nowrap;        /* 单行显示 */
      overflow: visible;          /* 超长不省略、不裁切 */
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
    }

    /* —— 模块 3:SC 内容 —— 811×119,居中多行,超长自适应缩小 —— */
    .fan-msg {
      position: absolute;
      left: 0px;
      top: 285px;                 /* PSD T=637 − 352 = 285 */
      width: 811px;
      height: 119px;
      margin: 0;
      padding: 0;
      font-family: "LPL HEI Extra", "Microsoft YaHei", sans-serif;
      font-size: 26px;            /* 对应 PSD 实测 SC 字高 26px(12pt) */
      font-weight: 400;
      line-height: 35px;          /* 26 × 1.33 ≈ 34.6,取整 35 对应 PSD 行距 15.98pt 的两倍行高 */
      color: #fff;
      letter-spacing: 0;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
      word-break: break-word;
      overflow-wrap: anywhere;
      overflow: hidden;           /* 配合 JS 自适应,防止溢出 */
      display: flex;
      flex-direction: column;
      justify-content: center;    /* 内容不足 3 行时垂直居中 */
    }
    .fan-msg-line {
      flex: none;
      width: 100%;
      text-align: center;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="B站SC上墙活动">

    <!--
      背景图 bg.png 已包含:顶部标题、分隔线、LPL logo + 二维码 + 文案、四角装饰。
      此处仅叠加 SC 上墙评论组,三个模块位置按 PSD 实测坐标逐像素固定。
    -->

    <section class="fanwall" aria-label="SC 上墙卡片">

      <!-- 1 · 乆牧_ -->
      <article class="fan-card active">
        <div class="fan-avatar">
          <img src="https://i1.hdslb.com/bfs/face/418817ce8294c2b442faa74e74f988871182b7ac.jpg" alt="乆牧_ 头像" loading="lazy">
        </div>
        <div class="fan-name">乆牧_</div>
        <p class="fan-msg"><span class="fan-msg-line">说起来今天线上跟客户推销推销半天客户跟我说我头像好可爱,我又想推销又怕掉马,我已急哭</span></p>
      </article>

      <!-- 2 · 満船淸夢 -->
      <article class="fan-card">
        <div class="fan-avatar">
          <img src="https://i0.hdslb.com/bfs/face/2a65d507795ea87b1c54675bf54650086e8b8dbe.jpg" alt="満船淸夢 头像" loading="lazy">
        </div>
        <div class="fan-name">満船淸夢</div>
        <p class="fan-msg"><span class="fan-msg-line">虽然刚刚出去了没听着是什么事,但是夸夸崽</span></p>
      </article>

      <!-- 3 · 临海文卫 -->
      <article class="fan-card">
        <div class="fan-avatar">
          <img src="https://i1.hdslb.com/bfs/face/5d1d1206893141761f1395d6f9de0e14b98bf944.jpg" alt="临海文卫 头像" loading="lazy">
        </div>
        <div class="fan-name">临海文卫</div>
        <p class="fan-msg"><span class="fan-msg-line">悄悄和崽说件事,前天你把某位老师的sc念成我的了,感受到了自己的份量,爱你哦!!!</span></p>
      </article>

      <!-- 4 · 卐组pm戌神mio怪人 -->
      <article class="fan-card">
        <div class="fan-avatar">
          <img src="https://i1.hdslb.com/bfs/face/7164ef81d3de992740fca7db33d84c7874cb3f9f.jpg" alt="卐组pm戌神mio怪人 头像" loading="lazy">
        </div>
        <div class="fan-name">卐组pm戌神mio怪人</div>
        <p class="fan-msg"><span class="fan-msg-line">是的,就是我得那条红色SC</span></p>
      </article>

      <!-- 5 · 桜宵夜 -->
      <article class="fan-card">
        <div class="fan-avatar">
          <img src="https://i0.hdslb.com/bfs/face/b1704d57af84b7f8035a984a8a80db5239f9602a.jpg" alt="桜宵夜 头像" loading="lazy">
        </div>
        <div class="fan-name">桜宵夜</div>
        <p class="fan-msg"><span class="fan-msg-line">啊啊啊啊,这是N头R!我不要听😱</span></p>
      </article>

    </section>
  </main>

  <script>
    /* —— SC 上墙卡片轮播:每张停留 3s,0.3s 淡入淡出切换 —— */
    (function () {
      const cards = document.querySelectorAll('.fan-card');
      const DISPLAY_MS = 3000;
      const BASE_SIZE = 26;      // PSD 实测 SC 字号基准
      const BASE_LH   = 35;      // PSD 实测 SC 行高基准
      let idx = 0;
      const N = cards.length;

      /* SC 内容自适应:超出固定区域则逐 px 缩小字号,保证完整显示 */
      function fitMsg(msgEl) {
        const maxHeight = msgEl.clientHeight;
        let size = BASE_SIZE;
        msgEl.style.fontSize = size + 'px';
        msgEl.style.lineHeight = BASE_LH + 'px';
        while (size > 10 && msgEl.scrollHeight > maxHeight + 1) {
          size -= 1;
          msgEl.style.fontSize = size + 'px';
          msgEl.style.lineHeight = Math.round(size * (BASE_LH / BASE_SIZE)) + 'px';
        }
      }

      function show(i) {
        cards.forEach((c, k) => c.classList.toggle('active', k === i));
        const msg = cards[i].querySelector('.fan-msg');
        if (msg) fitMsg(msg);
        idx = i;
      }

      function loop() {
        setTimeout(() => {
          show((idx + 1) % N);
          loop();
        }, DISPLAY_MS);
      }

      show(0);
      loop();
    })();
  </script>
</body>
</html>
