  <style>
    /* —— 引入本地字体 —— */
    /* 昵称用 Heavy(最粗档) */
    @font-face {
      font-family: "LPL HEI Heavy";
      src: url("./front/LPL HEI Heavy.ttf") format("truetype");
      font-display: swap;
    }
    /* SC 内容用 Book(常规档) */
    @font-face {
      font-family: "LPL HEI Book";
      src: url("./front/LPL HEI Book.ttf") format("truetype");
      font-display: swap;
    }

    /* —— 基础重置 —— */
    *,*::before,*::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-width: 1280px;
      background: #000;
      font-family: -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow-x: auto;
      color: #fff;
    }

    /* —— 根容器,固定 1920×1080 设计稿 —— */
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      margin: 0 auto;
      background: #000 url("./assets/bg.png") center/100% 100% no-repeat;
      overflow: hidden;
    }

    /* ===========================================================
       上墙卡片轮播区 (原页面 left:160, top:366, 921×596)
       内部三个模块位置按当前截图实测 (px):
         头像:   x=340, y=  0,  w=240, h=240  (圆角矩形,顶部对齐)
         昵称:   x=340, y=255,  w=240, h=105  (粗体大字,水平居中)
         SC内容: x=  0, y=405,  w=921, h=191  (满宽铺底,水平居中)
       =========================================================== */
    .fanwall {
      position: absolute;
      left: 160px;
      top: 366px;
      width: 921px;
      height: 596px;
      overflow: hidden;
    }

    /* 单条卡片(淡入淡出切换) */
    .fan-card {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .8s ease;
      pointer-events: none;
    }
    .fan-card.active { opacity: 1; pointer-events: auto; }

    /* —— 模块 1:头像(圆形,贴近参考图) —— */
    .fan-avatar {
      position: absolute;
      left: 340px;
      top: 0px;
      width: 240px;
      height: 240px;
      border-radius: 50%;            /* 圆形头像 */
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,.55);
    }
    .fan-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* 无头像兜底 */
    .fan-avatar.noimg {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 84px;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, #7a5cff, #ff5c8a);
    }

    /* —— 模块 2:昵称(单行,满宽完整显示,超长不省略) —— */
    .fan-name {
      position: absolute;
      left: 0px;
      top: 255px;
      width: 921px;      /* 满宽,容纳长昵称 */
      height: 105px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "LPL HEI Heavy", "Microsoft YaHei", sans-serif;
      font-size: 62px;               /* 对应 PSD 62pt(按 72dpi 换算) */
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      text-align: center;
      line-height: 1.2;
      /* 单行,不换行,超长也完整显示 */
      white-space: nowrap;
      overflow: visible;
      text-shadow: 0 4px 14px rgba(0,0,0,.7);
    }

    /* —— 模块 3:SC 内容(与头像昵称同一中心轴,区域内自适应字号) —— */
    .fan-msg {
      position: absolute;
      left: 0px;
      top: 405px;
      width: 921px;
      height: 191px;
      margin: 0;
      padding: 0 40px;
      box-sizing: border-box;
      font-family: "LPL HEI Book", "Microsoft YaHei", sans-serif;
      font-size: 45px;               /* 初始按 PSD 45pt;超长由 JS 自动缩小 */
      font-weight: 400;
      line-height: 1.35;
      color: #fff;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0,0,0,.65);
      text-align: center;
      word-break: break-word;
      overflow-wrap: anywhere;
      overflow: hidden;              /* 防溢出,配合 JS 自适应 */
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .fan-msg-line { flex: none; width: 100%; text-align: center; word-break: break-word; overflow-wrap: anywhere; }
  </style>
</head>
<body data-page-node-id="bTsMreozDxSbnyooEuKfMX">

  <script>
    /* —— 上墙卡片轮播:每张停留 10s 后淡出切换 —— */
    (function () {
      const cards = document.querySelectorAll('.fan-card');
      const DISPLAY_MS = 10000;
      let idx = 0;
      const N = cards.length;

      /* SC 内容自适应:超长则缩小字号,保证完整显示在固定区域内 */
      function fitMsg(msgEl) {
        const maxHeight = msgEl.clientHeight;
        msgEl.style.fontSize = '45px';               // 初始按 PSD 45pt
        let size = 45;
        // 反复缩小,直到内容能完全放进容器
        while (size > 10 && msgEl.scrollHeight > maxHeight + 1) {
          size -= 1;
          msgEl.style.fontSize = size + 'px';
        }
        msgEl.style.lineHeight = '1.35';
      }

      function show(i) {
        cards.forEach((c, k) => c.classList.toggle('active', k === i));
        // 显示当前卡后,让其 SC 文本自适应字号
        const msg = cards[i].querySelector('.fan-msg');
        if (msg) fitMsg(msg);
        idx = i;
      }

      function loop() {
        setTimeout(() => {
          show((idx + 1) % N);
          loop();
        }, DISPLAY_MS);
      }

      show(0);
      loop();
    })();
  </script>
